<!DOCTYPE html>
<html>
<body>

  <h2>Student Data</h2>
  <!-- Fixed the function name and added button text -->
  <button onclick="loadDATA()">Load Student</button> 
  <p id="result"></p>

  <script>
    async function loadDATA() {
      // Fixed typos: 'response' and 'await'
      const response = await fetch("https://jsonplaceholder.typicode.com/users/1");
      console.log(response);
      
      
      const data = await response.json();
      console.log(data);
      
      
      document.getElementById("result")
      .textContent =
       "Student Name: " + data.name;
    }
  </script>

</body>
</html>
